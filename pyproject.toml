[project]
name = "cairn-ml"
version = "0.1.0"
description = "Dependency-aware pipeline orchestration, experiment tracking, and a model registry for machine learning work."
authors = [{ name = "Mohid Bin Farooq" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cairn = "cairn.cli:main"

[project.optional-dependencies]
examples = ["scikit-learn>=1.3.0", "numpy>=1.24.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
